    <h2>CSSって何？</h2>
    <p>
      CSSは、Webページの見た目を整えるための言語です。
      色、文字の大きさ、余白、配置などを変更できます。
    </p>

    <h2>CSSでできること</h2>

    <div>
      <h3>色を変える</h3>
      <p>文字や背景の色を変更できます。</p>
    </div>

    <div>
      <h3>文字を大きくする</h3>
      <p>見出しや文章のサイズを自由に変更できます。</p>
    </div>

    <div>
      <h3>レイアウトを整える</h3>
      <p>文章や画像の位置、余白などを調整できます。</p>
    </div>
