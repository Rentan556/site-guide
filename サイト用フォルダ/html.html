    <h2>HTMLって何？</h2>
    <p>
      HTMLは、Webページの「構造」を作るための言語です。
      見出しや文章、画像、リンクなどを配置することができます。
    </p>

    <h2>HTMLでできること</h2>

    <div>
      <h3>見出しを作る</h3>
      <p>h1やh2などを使って、文章の見出しを作れます。</p>
    </div>

    <div>
      <h3>文章を書く</h3>
      <p>pタグを使って、Webページに文章を表示できます。</p>
    </div>

    <div>
      <h3>リンクを作る</h3>
      <p>aタグを使うと、別のページへ移動できるリンクを作れます。</p>
    </div>
